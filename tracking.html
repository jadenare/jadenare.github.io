<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>통관·택배 조회 툴</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system, BlinkMacSystemFont, "맑은 고딕", sans-serif;}
body{background:#f5f7fa;padding:16px;color:#222;max-width:680px;margin:0 auto;}
h1{font-size:22px;text-align:center;margin:20px 0;color:#111;}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,0.07);}
.row{margin-bottom:16px;}
label{display:block;margin-bottom:7px;font-weight:500;font-size:15px;color:#333;}
textarea{width:100%;padding:13px 14px;border:1px solid #dde0e4;border-radius:10px;font-size:16px;background:#fff;min-height:110px;resize:none;}

.btn-wrap{margin-top:8px;display:grid;grid-template-columns:1fr;gap:10px;}
.btn{width:100%;padding:14px;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:500;cursor:pointer;}
.btn-customs{background:#1d4ed8;}
.btn-cj{background:#0891b2;}
.btn-hanjin{background:#9333ea;}
.note{font-size:13px;color:#888;margin-top:12px;line-height:1.5;}

.preview-area{background:#f3f4f6;padding:12px;border-radius:10px;margin-bottom:14px;font-size:14px;}
.iframe-area{margin-top:20px;}
.iframe-title{font-size:16px;font-weight:600;margin-bottom:8px;}
iframe{width:100%;height:620px;border:1px solid #ddd;border-radius:10px;background:#ffffff;}
.hidden{display:none;}
</style>
</head>
<body>
<h1>통관·택배 바로가기 조회</h1>

<div class="card">
  <div class="row">
    <label>Code + 운송장 번호 붙여넣기</label>
    <textarea id="pasteArea" placeholder="메세지를 그대로 붙여넣기 해주세요"></textarea>
  </div>

  <div class="preview-area">
    <div>✅ Code : <span id="showCode">-</span></div>
    <div>✅ Invoice : <span id="showInvoice">-</span></div>
  </div>

  <div class="btn-wrap">
    <button class="btn btn-customs" id="goCustomsBtn">① 통관확인 (현재창 하단표시)</button>
    <button class="btn btn-cj" id="goCjBtn">② 선박이용시‑CJ대한통운(새창)</button>
    <button class="btn btn-hanjin" id="goHanjinBtn">③ 항공이용시‑한진택배(새창)</button>
  </div>
  <p class="note">
    • CJ, 한진은 사이트 보안정책으로 새창으로만 열립니다.
  </p>
</div>

<div id="iframeWrap" class="iframe-area hidden">
  <div class="iframe-title">📋 통관 조회 결과 (with‑seller)</div>
  <iframe id="customsIframe"></iframe>
</div>

<script>
const pasteArea = document.getElementById('pasteArea');
const showCode = document.getElementById('showCode');
const showInvoice = document.getElementById('showInvoice');
const goCustomsBtn = document.getElementById('goCustomsBtn');
const goCjBtn = document.getElementById('goCjBtn');
const goHanjinBtn = document.getElementById('goHanjinBtn');
const iframeWrap = document.getElementById('iframeWrap');
const customsIframe = document.getElementById('customsIframe');

let codeVal = "";
let invoiceVal = "";
const STORAGE_KEY = "trace_last_input";

// 저장된 데이터 불러오기
window.addEventListener('DOMContentLoaded',()=>{
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    try{
      const obj = JSON.parse(saved);
      codeVal = obj.code || "";
      invoiceVal = obj.invoice || "";
      pasteArea.value = codeVal + "\n" + invoiceVal;
      renderPreview();
    }catch(e){}
  }
});

function saveInput(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({code:codeVal,invoice:invoiceVal}));
}

// 텍스트 변경 시 자동 파싱
function parseText(){
  const text = pasteArea.value;
  const lineList = text.split(/\r?\n/).map(item=>item.trim()).filter(item=>item);
  codeVal = lineList[0] ?? "";
  invoiceVal = lineList[1] ?? "";
  renderPreview();
  saveInput();
}

// 미리보기 갱신
function renderPreview(){
  showCode.innerText = codeVal || "입력되지 않음";
  showInvoice.innerText = invoiceVal || "입력되지 않음";
}

pasteArea.addEventListener('input', parseText);

// ① 통관 조회
goCustomsBtn.addEventListener('click',()=>{
  if(!codeVal || !invoiceVal){
    alert("Code 와 Invoice 두 값을 전부 입력해 주세요.");
    return;
  }
  const url = `https://with-seller.com/guide/unipass_delivery.php?code=${encodeURIComponent(codeVal)}&invoice=${encodeURIComponent(invoiceVal)}`;
  customsIframe.src = url;
  iframeWrap.classList.remove('hidden');
});

// ② CJ 대한통운
goCjBtn.addEventListener('click',()=>{
  if(!invoiceVal){
    alert("운송장(Invoice) 번호를 입력해 주세요.");
    return;
  }
  const url = `https://trace.cjlogistics.com/next/tracking.html?wblNo=${encodeURIComponent(invoiceVal)}`;
  window.open(url,"_blank");
})

// ③ 한진택배
goHanjinBtn.addEventListener('click',()=>{
  if(!invoiceVal){
    alert("운송장(Invoice) 번호를 입력해 주세요.");
    return;
  }
  const url = `https://www.hanjin.com/kor/CMS/DeliveryMgr/WaybillResult.do?mCode=MN038&schLang=KR&wblnumText2=${encodeURIComponent(invoiceVal)}`;
  window.open(url,"_blank");
})
</script>
</body>
</html>
