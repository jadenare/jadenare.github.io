<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>통관·택배 바로가기 조회</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system, BlinkMacSystemFont, "맑은 고딕", sans-serif;}
body{background:#f5f7fa;padding:16px;color:#222;max-width:640px;margin:0 auto;}
h1{font-size:22px;text-align:center;margin:20px 0;color:#111;}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,0.07);}
.row{margin-bottom:16px;}
label{display:block;margin-bottom:7px;font-weight:500;font-size:15px;color:#333;}
input{width:100%;padding:13px 14px;border:1px solid #dde0e4;border-radius:10px;font-size:16px;background:#fff;}

.btn-wrap{margin-top:8px;display:grid;grid-template-columns:1fr;gap:10px;}
.btn{width:100%;padding:14px;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:500;cursor:pointer;}
.btn-customs{background:#1d4ed8;}
.btn-cj{background:#0891b2;}
.btn-hanjin{background:#9333ea;}
.note{font-size:13px;color:#888;margin-top:12px;line-height:1.5;}
</style>
</head>
<body>
<h1>통관·택배 바로가기 조회</h1>

<div class="card">
  <div class="row">
    <label>Code 입력 (통관)</label>
    <input type="text" id="codeVal" placeholder="예: GR2608251314049">
  </div>
  <div class="row">
    <label>Invoice / 운송장 번호</label>
    <input type="text" id="invoiceVal" placeholder="예: 520495013312">
  </div>
  <div class="btn-wrap">
    <button class="btn btn-customs" id="goCustomsBtn">① 통관확인(새창)</button>
    <button class="btn btn-cj" id="goCjBtn">② 선박‑CJ대한통운(새창)</button>
    <button class="btn btn-hanjin" id="goHanjinBtn">③ 항공‑한진택배(새창)</button>
  </div>
  <p class="note">
    • 버튼 클릭 시 해당 사이트 새탭으로 이동합니다.<br/>
  </p>
</div>

<script>
const codeInput = document.getElementById('codeVal');
const invoiceInput = document.getElementById('invoiceVal');
const goCustomsBtn = document.getElementById('goCustomsBtn');
const goCjBtn = document.getElementById('goCjBtn');
const goHanjinBtn = document.getElementById('goHanjinBtn');

const STORAGE_KEY = "trace_last_input";

// 페이지 로드 시 저장된 값 불러오기
window.addEventListener('DOMContentLoaded',()=>{
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    try{
      const obj = JSON.parse(saved);
      codeInput.value = obj.code || "";
      invoiceInput.value = obj.invoice || "";
    }catch(e){}
  }
});

// 입력값 저장
function saveInput(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    code: codeInput.value.trim(),
    invoice: invoiceInput.value.trim()
  }));
}

// ① 통관확인 (with‑seller)
goCustomsBtn.addEventListener('click',()=>{
  const code = codeInput.value.trim();
  const invoice = invoiceInput.value.trim();
  if(!code || !invoice){
    alert("Code 와 Invoice 값을 모두 입력해 주세요.");
    return;
  }
  saveInput();
  const url = `https://with-seller.com/guide/unipass_delivery.php?code=${encodeURIComponent(code)}&invoice=${encodeURIComponent(invoice)}`;
  window.open(url,"_blank");
});

// ② 선박‑CJ대한통운
goCjBtn.addEventListener('click',()=>{
  const invoice = invoiceInput.value.trim();
  if(!invoice){
    alert("운송장(Invoice) 번호를 입력해 주세요.");
    return;
  }
  saveInput();
  const url = `https://trace.cjlogistics.com/next/tracking.html?wblNo=${encodeURIComponent(invoice)}`;
  window.open(url,"_blank");
})

// ③ 항공‑한진택배
goHanjinBtn.addEventListener('click',()=>{
  const invoice = invoiceInput.value.trim();
  if(!invoice){
    alert("운송장(Invoice) 번호를 입력해 주세요.");
    return;
  }
  saveInput();
  const url = `https://www.hanjin.com/kor/CMS/DeliveryMgr/WaybillResult.do?mCode=MN038&schLang=KR&wblnumText2=${encodeURIComponent(invoice)}`;
  window.open(url,"_blank");
})
</script>
</body>
</html>
